<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>主播收益查询</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.5;
        }
        .page { display: none; min-height: 100vh; }
        .page.active { display: block; }

        /* 查询页 */
        .query-page { background: #fff; }
        .header-green {
            background: linear-gradient(135deg, #07c160 0%, #05a350 100%);
            color: #fff;
            padding: 16px 0 30px;
            text-align: center;
        }
        .header-green h1 { font-size: 18px; font-weight: 500; }
        .hero {
            text-align: center;
            padding: 30px 20px 20px;
        }
        .hero-icon { font-size: 42px; margin-bottom: 8px; }
        .hero h2 { font-size: 24px; font-weight: 600; color: #333; }
        .hero p { color: #999; font-size: 14px; margin-top: 6px; }

        .card {
            background: #fff;
            border-radius: 12px;
            margin: 0 16px 16px;
            padding: 18px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group { margin-bottom: 18px; }
        .form-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-input {
            width: 100%;
            height: 46px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 0 14px;
            font-size: 15px;
            background: #f9f9f9;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus { border-color: #07c160; background: #fff; }
        .form-input::placeholder { color: #bbb; }
        .form-select {
            width: 100%;
            height: 46px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 0 14px;
            font-size: 15px;
            background: #f9f9f9;
            outline: none;
            appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5l5-5' stroke='%23999' stroke-width='1.5' fill='none'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 14px center;
        }

        .btn-primary {
            width: 100%;
            height: 48px;
            background: #07c160;
            color: #fff;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: opacity 0.2s;
        }
        .btn-primary:active { opacity: 0.85; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }

        .recent-section { margin-top: 8px; }
        .recent-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }
        .recent-item:last-child { border-bottom: none; }
        .recent-icon { font-size: 22px; margin-right: 12px; }
        .recent-info { flex: 1; }
        .recent-info .main { font-size: 15px; color: #333; }
        .recent-info .sub { font-size: 12px; color: #999; margin-top: 2px; }
        .recent-month { color: #07c160; font-size: 14px; }

        .error-tip {
            color: #fa5151;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        /* 结果页 */
        .result-header {
            background: linear-gradient(135deg, #07c160 0%, #05a350 100%);
            color: #fff;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .result-header-left { display: flex; align-items: center; gap: 10px; }
        .back-arrow {
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 20px;
        }
        .result-header h1 { font-size: 17px; font-weight: 500; }
        .result-user {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.15);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .result-content { padding: 16px; }
        .result-hero {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 50px; height: 50px;
            background: #e6f7ed;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }
        .result-hero-info { flex: 1; }
        .result-hero-info .room { font-size: 16px; font-weight: 600; color: #333; }
        .result-hero-info .nick { font-size: 13px; color: #999; margin-top: 4px; }

        .section { margin-bottom: 16px; }
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .summary-card {
            background: #f0fff4;
            border-radius: 10px;
            padding: 14px;
            text-align: center;
        }
        .summary-card .label {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
        }
        .summary-card .value {
            font-size: 18px;
            font-weight: 600;
            color: #07c160;
        }

        .detail-list {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid #f5f5f5;
        }
        .detail-item:last-child { border-bottom: none; }
        .detail-item .label { font-size: 14px; color: #555; }
        .detail-item .value { font-size: 15px; font-weight: 600; color: #333; }
        .detail-item .value.positive { color: #07c160; }
        .detail-item .value.negative { color: #fa5151; }

        .highlight-row {
            background: #f0fff4;
        }

        .btn-back {
            width: 100%;
            height: 46px;
            border: 1px solid #07c160;
            color: #07c160;
            background: #fff;
            border-radius: 23px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .empty-state-icon { font-size: 48px; margin-bottom: 12px; }

        @media (min-width: 480px) {
            body { background: #f0f0f0; }
            .container {
                max-width: 430px;
                margin: 0 auto;
                background: #fff;
                min-height: 100vh;
                box-shadow: 0 0 20px rgba(0,0,0,0.05);
            }
        }
    </style>
</head>

    <div class="container">
        <!-- 查询页 -->
        <div id="queryPage" class="page query-page active">

                </div>
                <div class="error-tip" id="errorTip">未找到该房间号的收益数据，请检查输入</div>
                <button class="btn-primary" id="queryBtn">
                    查询明细 <span>›</span>
                </button>
            </div>

            <div class="card recent-section">
                <div class="card-title">🕐 最近查询</div>

                        <div style="font-size: 13px; color: #bbb;">暂无最近查询记录</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 结果页 -->
        <div id="resultPage" class="page">
            <div class="result-header">
                <div class="result-header-left">
                    <div class="back-arrow" id="backBtn">‹</div>
                    <h1>主播收益查询</h1>
                </div>
                <div class="result-user">
                    <span>👤</span>

            </div>

            <div class="result-content">
                <div class="result-hero">
                    <div class="avatar">👤</div>
                    <div class="result-hero-info">
                        <div class="room" id="resultRoom">房间 --</div>
                        <div class="nick" id="resultNick">昵称 -- · 经纪人 --</div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">💰 收益汇总</div>
                    <div class="summary-grid">
                        <div class="summary-card">
                            <div class="label">开票金额</div>
                            <div class="value" id="sumInvoice">0元</div>
                        </div>
                        <div class="summary-card">
                            <div class="label">最终补发金额</div>
                            <div class="value" id="sumFinalMakeup">0元</div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">🎤 流水明细</div>
                    <div class="detail-list">
                        <div class="detail-item"><span class="label">语音厅流水</span><span class="value positive" id="detVoiceFlow">0元</span></div>
                        <div class="detail-item"><span class="label">个播流水</span><span class="value positive" id="detSoloFlow">0元</span></div>
                        <div class="detail-item"><span class="label">大头号流水</span><span class="value positive" id="detBigFlow">0元</span></div>
                        <div class="detail-item"><span class="label">应发补贴</span><span class="value positive" id="detPayableSubsidy">0元</span></div>
                        <div class="detail-item"><span class="label">已发补贴</span><span class="value" id="detPaidSubsidy">0元</span></div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">⚡ 奖惩与提成</div>
                    <div class="detail-list">
                        <div class="detail-item"><span class="label">运营奖惩</span><span class="value" id="detOpsReward">0元</span></div>
                        <div class="detail-item"><span class="label">公会红包</span><span class="value positive" id="detGuildRed">0元</span></div>
                        <div class="detail-item"><span class="label">收光奖励</span><span class="value positive" id="detLightReward">0元</span></div>
                        <div class="detail-item"><span class="label">最终提成</span><span class="value positive" id="detFinalCommission">0元</span></div>
                        <div class="detail-item"><span class="label">最终收益提成</span><span class="value positive" id="detFinalEarningsCommission">0元</span></div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">🧮 财务计算</div>
                    <div class="detail-list">
                        <div class="detail-item"><span class="label">最终收益</span><span class="value positive" id="finFinalEarnings">0元</span></div>

                        <div class="detail-item highlight-row"><span class="label">最终补发金额</span><span class="value positive" id="finFinalMakeup">0元</span></div>
                    </div>
                </div>

                <button class="btn-back" id="returnBtn">返回查询</button>
            </div>
        </div>
    </div>

        // 工具函数
        const $ = id => document.getElementById(id);
        const fmtMoney = v => {
            const n = Number(v) || 0;
            return (n < 0 ? '-' : '') + '¥' + Math.abs(n).toFixed(2);
        };

        function findData(room) {
            const key = String(room).trim();
            return earningsData.find(r => String(r['房间号']).trim() === key);
        }

        function setText(id, value, cls) {
            const el = $(id);
            if (!el) return;
            el.textContent = value;
            if (cls) el.className = 'value ' + cls;
        }

        function getVal(r, key) {
            return Number(r[key]) || 0;
        }

        function showResult(record) {
            // Header
            $('headerRoom').textContent = record['房间号'];
            $('resultRoom').textContent = '房间 ' + record['房间号'];
            $('resultNick').textContent = (record['昵称'] || '--') + ' · ' + (record['经纪人'] || '--');

            // 收益汇总
            setText('sumInvoice', fmtMoney(getVal(record, '开票金额')));
            setText('sumFinalMakeup', fmtMoney(getVal(record, '最终补发金额')));

            // 流水明细
            setText('detVoiceFlow', fmtMoney(getVal(record, '语音厅流水')));
            setText('detSoloFlow', fmtMoney(getVal(record, '个播流水')));
            setText('detBigFlow', fmtMoney(getVal(record, '大头号流水')));
            setText('detPayableSubsidy', fmtMoney(getVal(record, '应发补贴')));
            setText('detPaidSubsidy', fmtMoney(getVal(record, '已发补贴')));

            // 奖惩与提成
            const opsReward = getVal(record, '运营奖惩');
            setText('detOpsReward', fmtMoney(opsReward), opsReward < 0 ? 'negative' : 'positive');
            setText('detGuildRed', fmtMoney(getVal(record, '公会红包')));
            setText('detLightReward', fmtMoney(getVal(record, '收光奖励')));
            setText('detFinalCommission', fmtMoney(getVal(record, '最终提成')));
            setText('detFinalEarningsCommission', fmtMoney(getVal(record, '最终收益提成')));

            // 财务计算
            setText('finFinalEarnings', fmtMoney(getVal(record, '应发收益或者补贴')));
            setText('finSelfEarnings', fmtMoney(getVal(record, '自提收益')));
            const tax = getVal(record, '扣税金额');
            setText('finTax', fmtMoney(tax), tax < 0 ? 'negative' : 'positive');
            setText('finAfterTax', fmtMoney(getVal(record, '税后金额')));
            setText('finMakeup', fmtMoney(getVal(record, '最终补发金额')));
            setText('finFinalMakeup', fmtMoney(getVal(record, '最终补发金额')));

            $('queryPage').classList.remove('active');
            $('resultPage').classList.add('active');
        }

        function doQuery() {
            const room = $('roomInput').value.trim();
            const errorTip = $('errorTip');
            if (!room) {
                errorTip.textContent = '请输入房间号';
                errorTip.style.display = 'block';
                return;
            }
            const record = findData(room);
            if (!record) {
                errorTip.textContent = '未找到该房间号的收益数据，请检查输入';
                errorTip.style.display = 'block';
                return;
            }
            errorTip.style.display = 'none';
            addRecent(room, record['昵称']);
            showResult(record);
        }

        function backToQuery() {
            $('resultPage').classList.remove('active');
            $('queryPage').classList.add('active');
        }

        function addRecent(room, nick) {
            let recent = JSON.parse(localStorage.getItem('earnings_recent') || '[]');
            recent = recent.filter(r => r.room !== room);
            recent.unshift({ room, nick: nick || '', time: Date.now() });
            if (recent.length > 5) recent = recent.slice(0, 5);
            localStorage.setItem('earnings_recent', JSON.stringify(recent));
            renderRecent();
        }

        function renderRecent() {
            const list = $('recentList');
            const recent = JSON.parse(localStorage.getItem('earnings_recent') || '[]');
            if (recent.length === 0) {
                list.innerHTML = `<div class="empty-state" style="padding: 30px 0;"><div style="font-size: 32px; margin-bottom: 8px;">📝</div><div style="font-size: 13px; color: #bbb;">暂无最近查询记录</div></div>`;
                return;
            }
            list.innerHTML = recent.map(r => `
                <div class="recent-item" data-room="${r.room}">
                    <div class="recent-icon">💰</div>
                    <div class="recent-info">
                        <div class="main">${r.nick || r.room}</div>
                        <div class="sub">房间 ${r.room}</div>
                    </div>
                    <div class="recent-month">›</div>
                </div>
            `).join('');

            list.querySelectorAll('.recent-item').forEach(item => {
                item.addEventListener('click', () => {
                    $('roomInput').value = item.dataset.room;
                    doQuery();
                });
            });
        }

        // 事件绑定
        $('queryBtn').addEventListener('click', doQuery);
        $('roomInput').addEventListener('keypress', e => { if (e.key === 'Enter') doQuery(); });
        $('backBtn').addEventListener('click', backToQuery);
        $('returnBtn').addEventListener('click', backToQuery);

        // 初始化
        renderRecent();
    </script>
</body>
</html>
